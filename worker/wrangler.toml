name = "artime-catalog"
main = "worker.js"
compatibility_date = "2024-11-01"

# Create the KV namespace once:  npx wrangler kv namespace create CATALOG
# then paste the id it prints below.
[[kv_namespaces]]
binding = "CATALOG"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# Secrets (run each, paste the value when asked):
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
